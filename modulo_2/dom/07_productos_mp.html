<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario (MP)</title>
</head>
<body>

  <h2>Inventario (MP)</h2>

  <table border="1">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Existencia</th>
        <th>Ubicación</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla"></tbody>
  </table>

  <div style="margin-top:16px">
    <form id="inventoryForm">
      <input id="nombre" placeholder="Nombre" required />
      <input id="descripcion" placeholder="Descripción" />
      <input id="precio" type="number" placeholder="Precio" />
      <input id="existencia" type="number" placeholder="Existencia" />
      <input id="ubicacion" placeholder="Ubicación" />
      <button type="submit">Agregar</button>
    </form>
  </div>

  <script src="07_productos_mp.js"></script>
</body>
</html>
