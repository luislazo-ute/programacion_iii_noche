<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script>console.log('02 variables head (MP)');</script>
    <script src="02_variables_mp.js"></script>
    <title>02 Variables - Inventario (MP)</title>
  </head>
  <body>
    <h2>02 Variables - Inventario</h2>
    <div id="inventoryApp">
      <form id="inventoryForm">
        <input id="nombre" placeholder="Nombre" required />
        <input id="descripcion" placeholder="Descripción" />
        <input id="precio" type="number" placeholder="Precio" />
        <input id="existencia" type="number" placeholder="Existencia" />
        <input id="ubicacion" placeholder="Ubicación" />
        <button type="submit">Agregar</button>
      </form>
      <table border="1">
        <thead><tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Existencia</th><th>Ubicación</th><th>Acciones</th></tr></thead>
        <tbody id="inventoryTable"></tbody>
      </table>
    </div>
  </body>
</html>
